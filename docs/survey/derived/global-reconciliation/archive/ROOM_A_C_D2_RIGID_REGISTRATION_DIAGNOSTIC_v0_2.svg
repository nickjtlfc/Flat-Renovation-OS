  <title id="title">Room A to Room C D2 rigid registration diagnostic v0.2</title>
  <desc id="desc">Fixed accepted Room C with rigidly transformed Room A. D2 clear and structural openings are centreline-aligned across an approximately 250 mm wall; casing faces remain distinct. The v0.2 rendering preserves the accepted project drawing convention with positive Y down the page.</desc>
