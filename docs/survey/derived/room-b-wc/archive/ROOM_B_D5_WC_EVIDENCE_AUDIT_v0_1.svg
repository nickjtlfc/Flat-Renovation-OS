<text x="970" y="688" class="t">To: B3 finished tiled corner</text>
<text x="970" y="716" class="t">Reading: 1218 mm; high-confidence baseline</text>
<text x="970" y="744" class="t">Method record: 'clear baseline' only</text>
<text x="970" y="772" class="t">Missing metadata: stance, height and exact contact faces</text>
<text x="970" y="800" class="t">Use: local finished-face wall length</text>
<text x="970" y="828" class="t">Do not promote it alone to structural wall plane.</text>
  <text x="80" y="1020" class="small" fill="#b91c1c">All D5 object, casing, reveal, tile and finished-wall layers remain separate. No geometry is corrected by this audit.</text>
