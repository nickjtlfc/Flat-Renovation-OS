  <rect x="940" y="185" width="520" height="360" rx="12" class="warn"/><text x="970" y="225" class="h">Field checks</text>
  <text x="970" y="260" class="t">1. B1→B3 direct total; record material contact.</text>
<text x="970" y="290" class="t">2. Repeat BASE-B-05 B2→B3 = 1218 mm.</text>
<text x="970" y="320" class="t">3. Measure B1↔T0 at a matched height.</text>
<text x="970" y="350" class="t">4. Measure B2↔D5-WCL at the same height.</text>
<text x="970" y="380" class="t">5. Photograph the B2 cutaway with a ruler in plane.</text>
<text x="970" y="410" class="t"></text>
<text x="970" y="440" class="t">Never identify B1 with T0 or B2 with D5-WCL.</text>
<text x="970" y="470" class="t">Never draw a wall through either D5 opening.</text>
  <rect x="940" y="585" width="520" height="300" rx="12" class="good"/><text x="970" y="625" class="h">BASE-B-05 meaning</text>
