  <text x="92" y="1321" class="side">Object stations replace v0.1 display/provisional points: CP1-FR 40.7 mm; D4-CL 18.33 mm; D3-CR 16.67 mm.</text>
  <text x="92" y="1347" class="side">D3/D4 casing-derived gap = 216.34 mm versus RC-09 218 mm (residual -1.66 mm).</text>

